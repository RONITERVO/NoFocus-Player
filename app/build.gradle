plugins {
    id 'com.android.application'
}

def toolVersions = new groovy.json.JsonSlurper().parse(rootProject.file('download-tools.json'))
android {
    namespace = 'dev.nofocus.folderplayer'
    compileSdk = 36

    defaultConfig {
        applicationId = 'dev.nofocus.folderplayer'
        minSdk = 23
        targetSdk = 36
        versionCode = 9
        versionName = '1.7.0'
        resValue 'string', 'download_runtime_version', "${toolVersions.androidRuntimeVersion}-${toolVersions.androidYtDlp.sha256.substring(0, 12)}"
        testInstrumentationRunner = 'dev.nofocus.folderplayer.CompactUiTest'
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // CLI executables and compressed runtime payloads must stay intact on disk.
    packaging.jniLibs {
        useLegacyPackaging = true
        keepDebugSymbols += ['**/*.so']
    }
    sourceSets.main {
        jniLibs.srcDir layout.buildDirectory.dir('generated/download-tools/jniLibs')
        res.srcDir layout.buildDirectory.dir('generated/download-tools/res')
        assets.srcDir rootProject.file('third-party')
    }
}

configurations { downloaderBinaries }
dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'net.lingala.zip4j:zip4j:2.11.6'
    // Extract native executables only; do not link the third-party Android wrapper.
    downloaderBinaries("io.github.junkfood02.youtubedl-android:library:${toolVersions.androidRuntimeVersion}@aar") { transitive = false }
    downloaderBinaries("io.github.junkfood02.youtubedl-android:ffmpeg:${toolVersions.androidRuntimeVersion}@aar") { transitive = false }
    testImplementation 'junit:junit:4.13.2'
}

tasks.register('unpackDownloadRuntimes', Sync) {
    inputs.file(rootProject.file('download-tools.json'))
    doFirst {
        configurations.downloaderBinaries.files.each { archive ->
            def component = archive.name.startsWith('library-') ? 'library' : 'ffmpeg'
            def digest = java.security.MessageDigest.getInstance('SHA-256')
            archive.withInputStream { input ->
                byte[] buffer = new byte[65536]
                int count
                while ((count = input.read(buffer)) != -1) digest.update(buffer, 0, count)
            }
            if (digest.digest().encodeHex().toString() != toolVersions.androidArchives[component])
                throw new GradleException("${component} runtime checksum mismatch")
        }
    }
    from { configurations.downloaderBinaries.collect { zipTree(it) } }
    include 'jni/**'
    eachFile { path = path.substring(4) }
    includeEmptyDirs = false
    into layout.buildDirectory.dir('generated/download-tools/jniLibs')
}

tasks.register('fetchYoutubeDownloader') {
    inputs.file(rootProject.file('download-tools.json'))
    def output = layout.buildDirectory.file('generated/download-tools/res/raw/yt_dlp')
    outputs.file(output)
    doLast {
        def target = output.get().asFile
        target.parentFile.mkdirs()
        def temporary = new File(target.parentFile, 'yt_dlp.tmp')
        try {
            new URI(toolVersions.androidYtDlp.url).toURL().withInputStream { input ->
                temporary.withOutputStream { it << input }
            }
            def digest = java.security.MessageDigest.getInstance('SHA-256')
            temporary.withInputStream { input ->
                byte[] buffer = new byte[65536]
                int count
                while ((count = input.read(buffer)) != -1) digest.update(buffer, 0, count)
            }
            if (digest.digest().encodeHex().toString() != toolVersions.androidYtDlp.sha256)
                throw new GradleException('yt-dlp checksum mismatch')
            java.nio.file.Files.move(temporary.toPath(), target.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        } finally { temporary.delete() }
    }
}
tasks.named('preBuild') { dependsOn 'unpackDownloadRuntimes', 'fetchYoutubeDownloader' }
